<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Stocky Daily Report</title>
  <style>
    /* 이메일 클라이언트 호환성을 위한 기본 스타일 */
    body {
      margin: 0;
      padding: 0;
      background-color: #f6f9fc; /* 전체 배경색: 아주 연한 회색 */
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* 메인 래퍼: 내용물을 중앙 정렬 */
    .email-wrapper {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 인사말 영역: 깔끔하게 텍스트만 */
    .greeting-section {
      text-align: center;
      margin-bottom: 30px;
      color: #333333;
    }

    .greeting-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 10px 0;
      letter-spacing: -0.5px;
    }

    .greeting-subtitle {
      font-size: 16px;
      color: #666666;
      margin: 0;
    }

    /* 리포트 카드 사이의 간격 */
    .report-spacer {
      height: 40px;
    }

    /* 푸터 스타일 */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #e1e4e8;
      color: #8898aa;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body style="background-color: #f6f9fc;">

<div class="email-wrapper">

  <div class="greeting-section">
    <h1 class="greeting-title">👋 안녕하세요, <span th:text="${userName}">회원</span>님!</h1>
    <p class="greeting-subtitle">Stocky AI가 분석한 오늘의 투자 리포트가 도착했습니다.</p>
  </div>

  <div th:each="report, iterStat : ${reports}">

    <div th:utext="${report.content}"></div>

    <div class="report-spacer" th:if="${!iterStat.last}"></div>

  </div>

  <div class="footer">
    <p>
      본 메일은 발신 전용입니다.<br>
      더 자세한 정보는 <a href="https://stocky.dev" style="color: #5e72e4; text-decoration: none; font-weight: bold;">Stocky 대시보드</a>에서 확인하세요.
    </p>
    <p>© 2025 Stocky Service. All rights reserved.</p>
  </div>

</div>

</body>
</html>
